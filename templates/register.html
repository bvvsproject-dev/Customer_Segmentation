<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AI Based Smart Customer Behavior Analysis for Business</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            overflow: hidden;
            position: relative;
        }
        .auth-bg-blob-1 { position: absolute; top: -10%; left: 80%; width: 400px; height: 400px; background: rgba(34, 197, 94, 0.3); border-radius: 50%; filter: blur(80px); animation: float 12s infinite alternate ease-in-out; }
        .auth-bg-blob-2 { position: absolute; bottom: -20%; left: -10%; width: 500px; height: 500px; background: rgba(79, 140, 255, 0.3); border-radius: 50%; filter: blur(90px); animation: floatReverse 15s infinite alternate ease-in-out; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-50px, 40px) scale(1.1); } }
        @keyframes floatReverse { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(60px, -60px) scale(1.05); } }
        
        .auth-card {
            z-index: 10;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(24px);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            animation: scaleInFade 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255,255,255,0.1);
            border-top: 1px solid rgba(255,255,255,0.2);
        }
        @keyframes scaleInFade {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .auth-title { text-align: center; margin-bottom: 2rem; }
        .auth-title i { font-size: 2.2rem; color: var(--primary); margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-bg-blob-1"></div>
        <div class="auth-bg-blob-2"></div>
        
        <div class="auth-card">
            <div class="auth-title">
                <i class="fas fa-layer-group"></i>
                <h2 style="font-weight: 700; color: #f8fafc;">Create an Account</h2>
                <p style="color: var(--text-muted); font-size: 0.95rem;">Join AI Based Smart Customer Behavior Analysis platform to analyze your data.</p>
            </div>

            {% if error %}
                <div style="background: rgba(239, 68, 68, 0.1); color: var(--accent-red); padding: 0.75rem; border-radius: 8px; margin-bottom: 1.5rem; text-align: center; border: 1px solid rgba(239, 68, 68, 0.2);">
                    <i class="fas fa-exclamation-circle"></i> {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('register') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" name="username" id="username" class="form-control" placeholder="Choose a username" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" class="form-control" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group" style="margin-bottom: 2rem;">
                    <label for="password">Password</label>
                    <div style="display: flex; gap: 0.5rem;">
                        <input type="password" name="password" id="password" class="form-control" placeholder="Create a secure password" required>
                        <button type="button" id="generate-pw-btn" class="btn btn-secondary" style="padding: 0 1rem;" title="Suggest Strong Password"><i class="fas fa-magic"></i></button>
                    </div>
                    <small id="password-suggestion" style="display: none; color: var(--accent-green); margin-top: 0.75rem; font-weight: 600; padding: 0.5rem; background: rgba(34,197,94,0.1); border-radius: 6px;"></small>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; border-radius: 50px; font-size: 1.05rem; padding: 0.85rem;">Sign Up <i class="fas fa-user-plus" style="margin-left: 0.5rem; font-size: 0.9rem;"></i></button>
            </form>
            
            <p style="text-align: center; margin-top: 2rem; font-size: 0.95rem;">
                Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary); text-decoration: none; font-weight: 600; border-bottom: 1px dashed var(--primary);">Sign in</a>
            </p>
        </div>
    </div>
    
    <!-- Script for password generation -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const genBtn = document.getElementById('generate-pw-btn');
            const pwInput = document.getElementById('password');
            const pwSuggestion = document.getElementById('password-suggestion');

            if (genBtn && pwInput && pwSuggestion) {
                genBtn.addEventListener('click', () => {
                    const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+";
                    let pw = "";
                    for (let i = 0; i < 16; i++) {
                        const arr = new Uint32Array(1);
                        window.crypto.getRandomValues(arr);
                        pw += chars[arr[0] % chars.length];
                    }
                    pwInput.value = pw;
                    pwInput.type = "text"; 
                    pwSuggestion.innerHTML = "<i class='fas fa-check-circle'></i> Strong password generated!";
                    pwSuggestion.style.display = "block";
                    
                    setTimeout(() => {
                        pwInput.type = "password";
                    }, 3000);
                });
            }
        });
    </script>
</body>
</html>
