<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Based Smart Customer Behavior Analysis for Business</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            background: linear-gradient(135deg, #091a38, #1e3c72, #2a5298);
            overflow: hidden;
            position: relative;
        }

        .auth-bg-blob-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: rgba(79, 140, 255, 0.4);
            border-radius: 50%;
            filter: blur(80px);
            animation: float 12s infinite alternate ease-in-out;
        }

        .auth-bg-blob-2 {
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: rgba(127, 127, 213, 0.3);
            border-radius: 50%;
            filter: blur(100px);
            animation: floatReverse 15s infinite alternate ease-in-out;
        }

        .auth-bg-blob-3 {
            position: absolute;
            top: 40%;
            left: 60%;
            width: 300px;
            height: 300px;
            background: rgba(232, 67, 147, 0.2);
            border-radius: 50%;
            filter: blur(60px);
            animation: float 8s infinite alternate-reverse ease-in-out;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(50px, 50px);
            }
        }

        @keyframes floatReverse {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(-50px, -50px);
            }
        }

        .auth-card {
            z-index: 10;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(24px);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            animation: slideUpFade 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .auth-title {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-title i {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-bg-blob-1"></div>
        <div class="auth-bg-blob-2"></div>
        <div class="auth-bg-blob-3"></div>

        <div class="auth-card">
            <div class="auth-title">
                <i class="fas fa-layer-group"></i>
                <h2 style="font-weight: 700; color: #f8fafc;">Welcome Back</h2>
                <p style="color: var(--text-muted); font-size: 0.95rem;">Sign in to your AI Based Smart Customer Behavior Analysis dashboard</p>
            </div>

            {% if error %}
            <div
                style="background: rgba(239, 68, 68, 0.1); color: var(--accent-red); padding: 0.75rem; border-radius: 8px; margin-bottom: 1.5rem; text-align: center; border: 1px solid rgba(239, 68, 68, 0.2);">
                <i class="fas fa-exclamation-circle"></i> {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" name="username" id="username" class="form-control"
                        placeholder="Enter your username or email" required>
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" class="form-control"
                        placeholder="Enter your password" required>
                </div>

                <div class="form-group" style="margin-bottom: 2rem; display: flex; align-items: center;">
                    <label style="display: flex; align-items: center; cursor: pointer; color: var(--text-muted); font-size: 0.95rem;">
                        <input type="checkbox" name="remember_me" style="margin-right: 0.5rem; width: 16px; height: 16px; cursor: pointer;">
                        Remember me for 30 days
                    </label>
                </div>

                <button type="submit" class="btn btn-primary"
                    style="width: 100%; border-radius: 50px; font-size: 1.05rem; padding: 0.85rem;">Sign In <i
                        class="fas fa-arrow-right" style="margin-left: 0.5rem; font-size: 0.9rem;"></i></button>
            </form>

            <p style="text-align: center; margin-top: 2rem; font-size: 0.95rem;">
                Don't have an account? <a href="{{ url_for('register') }}"
                    style="color: var(--primary); text-decoration: none; font-weight: 600; border-bottom: 1px dashed var(--primary);">Register
                    now</a>
            </p>
        </div>
    </div>
</body>

</html>
