{% extends "base.html" %}

{% block content %}
<div class="glass-card" style="max-width: 600px; margin: 0 auto;">
    <h2 class="text-center"><i class="fas fa-magic" style="color: var(--primary);"></i> Predict Customer Segment</h2>
    <p class="text-center" style="margin-bottom: 2rem;">Enter customer details to instantly assign them to a cluster.</p>

    <form id="predict-form">
        <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender" class="form-control" required>
                <option value="" disabled selected>Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" class="form-control" placeholder="e.g. 35" min="10" max="100" required>
        </div>
        
        <div class="form-group">
            <label for="income">Annual Income (k$)</label>
            <input type="number" id="income" class="form-control" placeholder="e.g. 75" min="0" max="250" required>
        </div>
        
        <div class="form-group">
            <label for="spending">Spending Score (1-100)</label>
            <input type="number" id="spending" class="form-control" placeholder="e.g. 50" min="1" max="100" required>
        </div>
        
        <button type="submit" class="btn btn-primary" id="predict-btn" style="width: 100%; justify-content: center; margin-top: 1rem;">
            <span class="loader" style="border-top-color: var(--card-bg);"></span>
            <span class="btn-text">Predict Cluster</span>
        </button>
    </form>
    
    <!-- Premium Result Box -->
    <div class="result-box premium-result-layout" id="result-box">
        <div class="result-header">
            <div id="gender-sticker-container" class="gender-sticker-small">
                <i id="gender-icon" class="fas fa-user"></i>
            </div>
            <div class="header-titles">
                <h3 id="res-cluster" class="cluster-badge">Cluster X</h3>
                <h4 id="res-label" class="label-title">Label Name</h4>
            </div>
        </div>

        <div class="customer-chips-container mt-3">
            <div class="customer-chip">
                <span class="chip-label">Age</span>
                <span class="chip-value" id="chip-age">--</span>
            </div>
            <div class="customer-chip">
                <span class="chip-label">Income</span>
                <span class="chip-value" id="chip-income">$--k</span>
            </div>
            <div class="customer-chip">
                <span class="chip-label">Score</span>
                <span class="chip-value" id="chip-spending">--</span>
            </div>
        </div>

        <div class="ai-recommendation-box mt-4">
            <div class="box-header">
                <i class="fas fa-bolt" style="color: var(--accent-yellow);"></i> AI Strategy Recommendation
            </div>
            <div class="box-content" id="res-rec">
                <!-- AI Content injected here -->
            </div>
        </div>

        <div class="campaign-channels-container mt-4" id="channels-container" style="display: none;">
            <h4 style="margin-bottom: 1rem; font-size: 1.1rem; color: var(--text-dark);"><i class="fas fa-bullhorn" style="color: var(--primary);"></i> Automated Pitches</h4>
            <div class="channels-grid" id="channels-grid">
                <!-- Rendered via JS -->
            </div>
        </div>

        <div class="chart-container-predict mt-4">
            <canvas id="predictionChart"></canvas>
        </div>
    </div>
</div>
{% endblock %}
